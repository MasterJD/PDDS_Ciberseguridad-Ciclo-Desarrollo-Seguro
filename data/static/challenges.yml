# Catálogo de retos de Juice Shop vaciado a propósito.
#
# Este fork se usa como aplicación vulnerable de práctica para el proyecto de
# SSDLC. El motor de retos, los modelos, las rutas y la UI se mantienen para no
# romper la aplicación, pero no se cargan retos: el Score Board queda vacío y
# las llamadas a challengeUtils quedan como no-op.
#
# Si en el futuro se necesita el catálogo original, se puede recuperar desde
# el repositorio upstream: https://github.com/juice-shop/juice-shop
[]
